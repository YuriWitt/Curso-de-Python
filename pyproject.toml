[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-analyzer"
version = "0.1.0"
description = "Analise reprodutivel de resultados da Mega-Sena e Lotofacil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lottery-analyzer = "lottery_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["lottery_analyzer*"]
