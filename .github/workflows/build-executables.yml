name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lottery-analyzer-linux
          - os: windows-latest
            artifact: lottery-analyzer-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name lottery-analyzer launcher.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/lottery-analyzer
            dist/lottery-analyzer.exe
